appId: com.atlitos.app
---
# Smoke test: guest can reach Home from a cold launch (either straight into
# Home if a guest session already persisted, or via the splash screen's
# "Continue as guest" button, apps/app/(auth)/splash.tsx) and the closing
# BrandFooter tagline (apps/mobile/src/components/organisms/home/BrandFooter.tsx)
# renders at the bottom of the scroll.
- launchApp
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
# Sign out of any session a previous flow left behind. Home no longer has a
# log out control; it lives in Settings, reached from the You tab's
# "Settings" button (apps/mobile/src/app/profile/index.tsx), and the row is
# "Sign out" (SettingsContent.tsx). A guest's You tab shows a sign in prompt
# with no Settings button, so every step here is optional or conditional and
# the guest state passes straight through. Sign out replaces to Home; a guest
# is still on You, so the "Home" tap brings both back to the same place.
- tapOn:
    text: "You"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element:
            text: "Sign out"
          direction: DOWN
          timeout: 15000
          speed: 60
          optional: true
      - tapOn:
          text: "Sign out"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    text: "Home"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
- assertVisible: "ATLITOS"
- assertVisible: "Badminton"
- scrollUntilVisible:
    element:
      text: "Built for Athletes. Backed by Tech. Powered by Purpose."
    direction: DOWN
    timeout: 20000
- assertVisible: "Built for Athletes. Backed by Tech. Powered by Purpose."
- takeScreenshot: /tmp/maestro-suite/smoke-guest-home-footer
