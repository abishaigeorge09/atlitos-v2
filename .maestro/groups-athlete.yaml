# Trainings Groups, athlete side (PRD-01, groups phase). Logs in as the
# seeded player@ account (an active Cric Squad member): Stats tab shows
# the My groups card, Chat tab shows the group thread row and sender
# names on group message bubbles plus a fresh message send, and the
# Coaches browse -> coach1 detail Groups section shows Cric Squad with
# spots left and the monthly fee in mono.
#
# Writes one chat message ("Test from athlete flow") to the seeded Cric
# Squad thread; that is additive content, not a state transition, so
# there is nothing to reset afterward.
#
# Coach1's display name is "Ravi Kumar" (confirmed live via read only SQL
# against syzzfgaudpifwvbpycyi on 2026-08-13, user 5b262cf1-8f95-45df-b453-
# 0802013f82a1), not "Demo Coach One": launch Phase 1's security lockdown
# renamed/rotated the seed accounts.
appId: com.atlitos.app
---
# Fresh app state every run, see groups-coach.yaml for why.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- openLink: atlitos://login
- extendedWaitUntil:
    visible: "Email or phone.*"
    timeout: 10000
- tapOn: "Email or phone input"
- inputText: "player@atlitos.dev"
- tapOn: "Password input"
- inputText: "AtlitosDemo!2026"
- tapOn:
    text: "Log in"
    index: 1
- extendedWaitUntil:
    visible: "Hyderabad|Save Password.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Hyderabad"
    timeout: 10000

- openLink: atlitos://trainings
- extendedWaitUntil:
    visible: "Your trainings at a glance"
    timeout: 15000
- assertVisible: "Trainings"
- assertVisible: "Stats"

# Stats tab: My groups card, Cric Squad active until its seeded
# period_end. Other seeded/probe groups (from unrelated test data) sit
# above it in the list, so scroll to the Cric Squad row itself, not just
# the "My groups" heading, or its date/fee line stays clipped below the
# fold.
- scrollUntilVisible:
    element:
      text: "My groups"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Cric Squad"
    direction: DOWN
    timeout: 10000
- assertVisible: "Cric Squad"
- assertVisible: "Active until 25 Sep 2026"
- takeScreenshot: /tmp/groups-verify/athlete-stats-my-groups

# Chat tab: the group thread row (name + member count differentiator).
# The row is one grouped accessibility element (name + timestamp +
# preview + member count collapse to a single accessibilityText), so
# match as a substring regex.
#
# CORRECTED 2026-08-13, this was NOT a status-filtering bug. This
# assertion previously hardcoded "4 members" (coach1 plus 3 active
# players, true when the flow was authored). A 4th athlete
# (afc9b95e-72ad-4ccd-89df-3d394795da0e) has since taken an active, paid
# membership (group_memberships row, status=active, real payment_intent_id,
# created 2026-07-26), so the group now legitimately has 4 active players.
# Verified via read only SQL against syzzfgaudpifwvbpycyi that the member
# count DOES correctly filter on status: chat_thread_members for this
# thread (95b9e6f6-379a-43c4-8541-f6d0829d64a3) holds exactly 5 rows,
# coach1 plus the 4 active players, and the group's one pending membership
# (player 8f1bbcdf, status=pending, no chat_thread_members row) is
# correctly absent. "5 members" is the correct, current count, not a
# status-filter defect. Stale fixture, not a product bug.
- tapOn: "Chat"
- extendedWaitUntil:
    visible: ".*Cric Squad.*"
    timeout: 10000
- assertVisible: ".*5 members.*"
- takeScreenshot: /tmp/groups-verify/athlete-chat-thread-row

# Open the group thread: sender names above bubbles, then send a message.
# The message input field's own selector must be specific: ".*Message.*"
# (or the bare unanchored string "Message") also matches the "Send
# message" button's accessibility label as a substring, so it could tap
# Send instead of the text field, leaving nothing typed and the assert
# below failing (confirmed reproduced: input showed the placeholder still
# empty). The input's actual accessibilityText is "Message input Message"
# (label plus placeholder concatenated), confirmed via the screen
# hierarchy JSON, so match on "Message input" specifically. Maestro text
# selectors are full-match regexes (see every other flow's ".*...*"
# wrapping), a bare "Message input" with no wildcards does not match.
- tapOn: ".*Cric Squad.*"
- extendedWaitUntil:
    visible: "Send message"
    timeout: 10000
- assertVisible: ".*5 members.*"
- takeScreenshot: /tmp/groups-verify/athlete-chat-thread-open
- tapOn: ".*Message input.*"
- inputText: "Test from athlete flow"
- tapOn: "Send message"
- extendedWaitUntil:
    visible: "Test from athlete flow"
    timeout: 10000
- assertVisible: "Test from athlete flow"
- takeScreenshot: /tmp/groups-verify/athlete-chat-message-sent
- tapOn: "Back"

# Coaches tab: browse to coach1's detail, Groups section.
- tapOn: "Coaches"
- extendedWaitUntil:
    visible: "My coaches"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Browse coaches"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      text: ".*Ravi Kumar.*"
    direction: DOWN
    timeout: 25000
- tapOn:
    text: ".*Ravi Kumar.*"
    index: 0
- extendedWaitUntil:
    visible: "Session type"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Groups"
    direction: DOWN
    timeout: 15000
- assertVisible: ".*Cric Squad.*"
- assertVisible: ".*of 8 spots left.*"
- assertVisible: ".*2,000/mo.*"
- takeScreenshot: /tmp/groups-verify/athlete-coach-groups-section
