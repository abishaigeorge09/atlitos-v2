appId: com.atlitos.app
---
# KNOWN LOCAL GAP, 2026-08-14: this flow needs a PAYMENTS dataset the local seed
# does not provide. It passes against production and fails locally, which makes
# it a HARNESS finding, not a product one.
#
# Fixed along the way, both now in scripts/reset-local-fixtures.sh:
#   - the 1:1 coaching chat thread (the "Ravi Kumar" chat assertion)
#   - three completed sessions, since Analytics renders an honest empty state
#     ("Complete at least 3 sessions to see your trends here") below that
#
# STILL BLOCKED: public.payment_intents is EMPTY locally (0 rows), so the
# Payments tab has nothing to list and the "Ravi Kumar, <date>" transaction row
# cannot appear.
#
# DO NOT hand-seed payment rows to make this green. Money rows carry a
# double-entry ledger with a deferred balance constraint, and inventing them by
# hand is exactly the shape that produced 73 captured payments orphaned from
# their entity (task #40). A fake-money fixture that makes a test pass is worse
# than a test that honestly cannot run.
#
# THE RIGHT FIX is to let the product create them: run a Razorpay TEST payment
# through book-session against the local stack once the payment edge functions
# are deployed (task #43), then snapshot that state as a fixture.
# Trainings fixed shell verification, both roles (PRD-01 3.3, PRD-02 3.2
# to 3.9). Proves the founder directive: the module title plus
# TrainingsSubNav stay fixed while switching tabs (only the content below
# swaps, no page push), the chat tab embeds the thread list inline instead
# of redirecting to /chat, a thread and a drill in push ABOVE the module
# and back returns to the tab that opened them, and tab switching never
# piles up a back stack.
#
# Shell intact proof at every step: the "Trainings" module title AND the
# sub nav's "Stats" tab label are both visible. On a pushed drill in the
# sub nav must NOT be visible (the screen sits above the module).
#
# Signs in as the athlete demo account first, then the coach demo account,
# via the atlitos://login deep link. Unlike the guest suite this flow signs
# in, but it still writes no server state (taps only lists, tabs, back).
#
# Coach1's display name is "Ravi Kumar" (confirmed live via read only SQL
# against syzzfgaudpifwvbpycyi on 2026-08-13, user 5b262cf1-8f95-45df-b453-
# 0802013f82a1), not "Demo Coach One": launch Phase 1's security lockdown
# renamed/rotated the seed accounts. The upcoming session drill in
# assertion further down does not pin an exact date: it originally
# targeted "2026-07-30", a session that has since passed and dropped off
# the upcoming list (replaced on device by a later one, 2026-08-25, per
# ordinary calendar movement), so a fixed date goes stale on its own with
# no data change at all. Matches any upcoming session with this coach
# instead (".*Ravi Kumar, 2026-.*"), which does not require re-editing
# every time the clock advances past whatever date was hardcoded.
appId: com.atlitos.app
---
# ---------- Athlete: player@atlitos.dev ----------
# Fresh app process per run: three account switches in one long lived dev
# process can flake the profile refresh, which is not what this flow is
# proving.
- launchApp
# A Save Password dialog from an earlier aborted run may still be up.
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
# State normalization: `atlitos://login` has no guard of its own
# (apps/mobile/src/app/(auth)/login.tsx renders unconditionally), but a
# leftover session (guest OR a previous run's player/coach, since the iOS
# Keychain backing expo-secure-store outlives `launchApp` and even
# `clearState`) makes splash.tsx auto route away from Login before Maestro
# ever sees it, so the deep link silently no-ops onto Home instead (the
# "Email or phone.*" failure this flow was hitting). Force a real
# signed_out state first via the app's own "Log out" control (Home tab,
# bottom of the scroll, FR-65: returns to guest mode at Home, not to
# Login) so the deep link below is guaranteed to land on the login form
# regardless of whatever account the simulator was left in. Same pattern
# as groups-join-guard.yaml.
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 25000
    speed: 60
    optional: true
- runFlow:
    when:
      visible: "Log out"
    commands:
      - tapOn: "Log out"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
- extendedWaitUntil:
    visible: "ATLITOS"
    timeout: 15000
- openLink: atlitos://login
- extendedWaitUntil:
    visible: "Email or phone.*"
    timeout: 10000
- tapOn: "Email or phone input"
- inputText: "player@atlitos.dev"
- tapOn: "Password input"
- inputText: "AtlitosDemo!2026"
- tapOn:
    text: "Log in"
    index: 1
# iOS may offer to save the just-typed password at any point after
# submit; wait for either outcome, dismiss the dialog if it is the one
# showing, then require Home.
- extendedWaitUntil:
    visible: "Hyderabad|Save Password.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Hyderabad"
    timeout: 10000

# Enter the module. Stats is the root tab. The bottom nav tap can be
# swallowed right after login, so retry until the sub nav shows.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Stats"
          commands:
            - tapOn: "Trainings"
            - waitForAnimationToEnd:
                timeout: 3000
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible: "Your trainings at a glance"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- assertVisible: "Coaches"
- assertVisible: "Payments"
- takeScreenshot: /tmp/trainings-shell/player-stats

# Coaches tab: shell stays, content swaps.
- tapOn: "Coaches"
- extendedWaitUntil:
    visible: "My coaches"
    timeout: 10000
- assertVisible: "Browse coaches"
- assertVisible: "Coach Ravi Kumar"
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/player-coaches

# Payments tab.
- tapOn: "Payments"
- extendedWaitUntil:
    visible: "Transactions"
    timeout: 10000
- assertVisible: "Paid for sessions held"
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/player-payments

# Chat tab: inline thread list, no redirect, shell intact. Thread rows no
# longer mask the participant name (confirmed via screenshot on
# 2026-08-13: 1:1 threads show the real counterparty name directly, no
# "Atlitos user" placeholder anywhere in current source either). The
# player has several 1:1 threads with coach1 ("Ravi Kumar", confirmed live
# via read only SQL against syzzfgaudpifwvbpycyi: chat_threads rows with
# participant_b 5b262cf1-8f95-45df-b453-0802013f82a1), so match that.
- tapOn: "Chat"
- extendedWaitUntil:
    visible: ".*Ravi Kumar.*"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/player-chat

# Open a thread: conversation pushes ABOVE the module (sub nav hidden),
# back returns to the Chat tab with the shell intact.
- tapOn:
    text: ".*Ravi Kumar.*"
    index: 0
- extendedWaitUntil:
    visible: "Send message"
    timeout: 10000
- assertNotVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/player-chat-thread
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".*Ravi Kumar.*"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- assertVisible: "Chat"

# Analytics tab. Was authored assuming the player had 2 held sessions,
# under a 3 session empty state threshold ("Not enough sessions yet").
# The player's session history has grown organically since then (5 held
# sessions confirmed live via read only SQL against syzzfgaudpifwvbpycyi
# on 2026-08-13, well over the threshold), so the tab now renders real
# analytics content, not the empty state. Assert the "Sessions held" stat
# tile label instead of a session count dependent empty state string, so
# this does not go stale again the next time the count changes.
- tapOn: "Analytics"
- extendedWaitUntil:
    visible: "Sessions held"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/player-analytics

# Drill in: upcoming session card on Stats pushes Session detail above the
# module; back returns to the Stats tab. The groups phase added a "My
# groups" card above this session card, so it is no longer guaranteed to
# be on screen without a scroll.
- tapOn: "Stats"
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible: "Your trainings at a glance"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*Ravi Kumar, 2026-.*"
    direction: DOWN
    timeout: 15000
    centerElement: true
# The session card sat right at the bottom edge of the screen after the
# scroll (confirmed via screenshot: "Ravi Kumar / Batting Basics" was
# only the top sliver of the card, cut off by the tab bar), and tapping
# an element whose bounding box straddles the tab bar landed on the
# Clutch tab instead of the card (confirmed reproduced: the flow ended up
# on the Clutch feed). `centerElement: true` above forces the scroll to
# bring the whole card clear of the tab bar before this tap.
- tapOn:
    text: ".*Ravi Kumar, 2026-.*"
    index: 0
- extendedWaitUntil:
    visible: "Session"
    timeout: 10000
- assertNotVisible: "Payments"
- takeScreenshot: /tmp/trainings-shell/player-session-drillin
- tapOn: "Back"
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible: "Your trainings at a glance"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"

# No back stack pileup: after all that tab switching, one Home tap leaves
# the module cleanly.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Hyderabad"
          commands:
            - tapOn: "Home"
            - waitForAnimationToEnd:
                timeout: 3000
- assertVisible: "Hyderabad"

# ---------- Coach: coach1@atlitos.dev ----------
# Same normalization as the athlete entry above: the player session from
# the block just above would otherwise make this second `atlitos://login`
# no-op onto Home exactly like the first one did.
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 25000
    speed: 60
    optional: true
- runFlow:
    when:
      visible: "Log out"
    commands:
      - tapOn: "Log out"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
- extendedWaitUntil:
    visible: "ATLITOS"
    timeout: 15000
- openLink: atlitos://login
- extendedWaitUntil:
    visible: "Email or phone.*"
    timeout: 10000
- tapOn: "Email or phone input"
- inputText: "coach1@atlitos.dev"
- tapOn: "Password input"
- inputText: "AtlitosDemo!2026"
- tapOn:
    text: "Log in"
    index: 1
# iOS may offer to save the just-typed password at any point after
# submit; wait for either outcome, dismiss the dialog if it is the one
# showing, then require Home.
- extendedWaitUntil:
    visible: "Hyderabad|Save Password.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Hyderabad"
    timeout: 10000

# Coach Stats dashboard. Same retry as the athlete entry.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Stats"
          commands:
            - tapOn: "Trainings"
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible: "Players coached"
    timeout: 15000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- assertVisible: "Trainees"
- assertVisible: "Earnings"
# Session requests sits below the fold; the sub nav must stay fixed
# while only the content scrolls.
- scrollUntilVisible:
    element:
      text: "Session requests"
    direction: DOWN
- assertVisible: "Stats"
- scrollUntilVisible:
    element:
      text: "Players coached"
    direction: UP
- takeScreenshot: /tmp/trainings-shell/coach-stats

# Trainees tab (trainee renders masked as "Athlete" with a session count).
- tapOn: "Trainees"
- extendedWaitUntil:
    visible: ".*sessions, last on.*"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/coach-trainees

# Earnings tab (filter chips are its distinctive content).
- tapOn: "Earnings"
- extendedWaitUntil:
    visible: "Session income"
    timeout: 10000
- assertVisible: "Transfer out"
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/coach-earnings

# Chat tab inline. Names are not masked (see the player section above);
# coach1's 1:1 threads are with the player account, display name "Demo
# Player" (confirmed live via read only SQL, users.id
# 58756043-7c59-43b2-b23a-c72f0011970f, and matches the chat_threads
# participant rows for coach1).
- tapOn: "Chat"
- extendedWaitUntil:
    visible: ".*Demo Player.*"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/coach-chat

# Open a thread and come back to the Chat tab.
- tapOn:
    text: ".*Demo Player.*"
    index: 0
- extendedWaitUntil:
    visible: "Send message"
    timeout: 10000
- assertNotVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/coach-chat-thread
- tapOn: "Back"
- extendedWaitUntil:
    visible: ".*Demo Player.*"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- assertVisible: "Chat"

# Video Analytics tab. Was authored assuming the coach had 2 completed
# sessions, under the 3 session empty state threshold. Coach1 has at
# least 5 rated sessions now (confirmed live via read only SQL against
# syzzfgaudpifwvbpycyi on 2026-08-13), same organic growth as the player
# Analytics tab above, so this renders real content too. The coach branch
# of analytics.tsx is a different layout from the athlete branch though
# (confirmed via screenshot and source): no top level "Sessions held"
# tile, monthly cards straight away with a "Hours coached" row label
# (analytics.tsx line 176), so assert that instead.
- tapOn: "Video Analytics"
- extendedWaitUntil:
    visible: "Hours coached"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"
- takeScreenshot: /tmp/trainings-shell/coach-analytics

# Drill in: Availability pushes above the module from the Stats tab; back
# returns to the Stats tab.
- tapOn: "Stats"
- extendedWaitUntil:
    visible: "Players coached"
    timeout: 10000
- tapOn: "Availability"
- extendedWaitUntil:
    visible: "Availability"
    timeout: 10000
- assertNotVisible: "Trainees"
- takeScreenshot: /tmp/trainings-shell/coach-availability-drillin
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Players coached"
    timeout: 10000
- assertVisible: "Trainings"
- assertVisible: "Stats"

# Clean exit to Home.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Hyderabad"
          commands:
            - tapOn: "Home"
            - waitForAnimationToEnd:
                timeout: 3000
- assertVisible: "Hyderabad"
