appId: com.atlitos.app
---
# Home -> Clutch preview card (apps/mobile/src/components/organisms/home/ClutchPreviewCard.tsx)
# -> tap Like (ClutchPostCard's like Pressable already carries
# accessibilityLabel "Like"/"Unlike", apps/mobile/src/components/molecules/ClutchPostCard.tsx)
# -> as a guest this raises LoginGateModal/LoginGateSheet, whose copy is
# verbatim "Want to hit the spotlight?" -> dismiss via the sheet's "Close"
# button.
#
# TESTABILITY FINDING (recorded in the suite report): LoginGateSheet is
# rendered inside a native <Modal> (apps/mobile/src/components/organisms/
# LoginGateModal.tsx). Everything in that sheet except the "Close" Pressable
# (apps/mobile/src/components/organisms/LoginGateSheet.tsx) is invisible to
# Maestro's iOS accessibility tree walk, confirmed even after adding explicit
# accessibilityLabel/accessible props to the heading, subtitle and the
# Login/Register buttons and reloading the bundle (verified the reload took
# with a throwaway text marker). assertVisible/tapOn on "Want to hit the
# spotlight?", "Login" or "Register" all fail to find the element, while
# "Close" (a Pressable with an accessibilityLabel that predates this suite)
# is found reliably. So this flow asserts the gate opened/closed via the
# "Close" control (the one reliable proxy) and a screenshot carries the
# literal copy for the human record instead of a text assertion.
- launchApp
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
# Sign out of any session a previous flow left behind. Home no longer has a
# log out control; it lives in Settings, reached from the You tab's
# "Settings" button (apps/mobile/src/app/profile/index.tsx), and the row is
# "Sign out" (SettingsContent.tsx). A guest's You tab shows a sign in prompt
# with no Settings button, so every step here is optional or conditional and
# the guest state passes straight through. Sign out replaces to Home; a guest
# is still on You, so the "Home" tap brings both back to the same place.
- tapOn:
    text: "You"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element:
            text: "Sign out"
          direction: DOWN
          timeout: 15000
          speed: 60
          optional: true
      - tapOn:
          text: "Sign out"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    text: "Home"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
- assertVisible: "ATLITOS"
- scrollUntilVisible:
    element:
      text: "Open Clutch"
    direction: DOWN
    timeout: 15000
- assertNotVisible: "Close"
- repeat:
    times: 3
    while:
      notVisible: "Close"
    commands:
      - runFlow:
          when:
            visible: "Like"
          commands:
            - tapOn: "Like"
      - runFlow:
          when:
            visible: "Unlike"
          commands:
            - tapOn: "Unlike"
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible: "Close"
- takeScreenshot: /tmp/maestro-suite/clutch-like-gate-sheet
- tapOn: "Close"
- assertNotVisible: "Close"
