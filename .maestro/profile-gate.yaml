appId: com.atlitos.app
---
# Guest taps the AppBar avatar (apps/mobile/src/components/ui/app-bar.tsx);
# accessibilityLabel="Profile" was added to that Pressable as part of this
# suite (it had none before). onPressProfile in
# apps/mobile/src/app/(tabs)/index.tsx opens LoginGateModal for a guest
# instead of navigating to /profile.
#
# See clutch-like-gate.yaml for the recorded testability finding: the gate's
# heading copy and Login/Register buttons are not visible to Maestro's iOS
# accessibility walk (they live inside a native <Modal>), only the "Close"
# Pressable is. This flow asserts on "Close" as the reliable proxy for the
# gate being open, plus a screenshot for the human record.
- launchApp
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
# Sign out of any session a previous flow left behind. Home no longer has a
# log out control; it lives in Settings, reached from the You tab's
# "Settings" button (apps/mobile/src/app/profile/index.tsx), and the row is
# "Sign out" (SettingsContent.tsx). A guest's You tab shows a sign in prompt
# with no Settings button, so every step here is optional or conditional and
# the guest state passes straight through. Sign out replaces to Home; a guest
# is still on You, so the "Home" tap brings both back to the same place.
- tapOn:
    text: "You"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element:
            text: "Sign out"
          direction: DOWN
          timeout: 15000
          speed: 60
          optional: true
      - tapOn:
          text: "Sign out"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    text: "Home"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
- assertVisible: "ATLITOS"
- assertNotVisible: "Close"
- repeat:
    times: 3
    while:
      notVisible: "Close"
    commands:
      - tapOn: "Profile"
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible: "Close"
- takeScreenshot: /tmp/maestro-suite/profile-gate-sheet
- tapOn: "Close"
- assertNotVisible: "Close"
- assertVisible: "ATLITOS"
