appId: com.atlitos.app
---
# Walks Login and Register without ever submitting a form or creating an
# account.
#
# APP BUG (recorded in the suite report, not fixed here per task scope): the
# guest login gate's own "Login" button (apps/mobile/src/components/
# organisms/LoginGateSheet.tsx -> onLogin -> LoginGateModal.handleLogin,
# apps/mobile/src/components/organisms/LoginGateModal.tsx) does not
# navigate to /(auth)/login. Tapping it (confirmed repeatedly, by exact
# coordinate, since the button is not text-findable, see clutch-like-gate.yaml
# for why) only closes the sheet and leaves the guest on Home. Every other
# gate entry point in this suite (profile-gate.yaml, clutch-like-gate.yaml)
# is therefore verified only up to the gate opening/closing, never through
# to Login. This flow reaches Login and Register instead through the app's
# own atlitos:// deep link scheme (app.json "scheme": "atlitos"), a real,
# user-reachable capability (e.g. a marketing link), confirmed working.
#
# APP BUG, CONFIRMED 2026-08-13, root caused in source, left failing on
# purpose (do not weaken this assertion to pass): after the false pass on
# "ATLITOS" was fixed (see below), this flow's final assertion genuinely
# fails on a fresh Release build, on device, every run. Tapping "Log in"
# on Register pushes Login onto the stack (Register stays underneath).
# Tapping "Continue as guest" on Login calls afterAuth()
# (apps/mobile/src/app/(auth)/login.tsx lines 46 to 58), which always
# prefers `router.back()` when `router.canGoBack()` is true, on the
# assumption Login was reached from a mutating gate that should resume
# its origin screen. That assumption does not hold for Login reached via
# Register's own "Log in" link: canGoBack() is true (Register is still on
# the stack), so continueAsGuest lands the user back on Register instead
# of Home. Severity P2: a guest who backs out of signup via Login can get
# stuck cycling back into Register instead of reaching Home. Fix belongs
# in login.tsx's afterAuth(), not in this test (e.g. only router.back()
# when the previous screen is a gate-raising screen, not another auth
# screen). Filed for Track F, not fixed here per task scope.
- launchApp
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 25000
    speed: 60
    optional: true
- runFlow:
    when:
      visible: "Log out"
    commands:
      - tapOn: "Log out"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
# "ATLITOS" (all caps, AppBar.tsx line 90) is NOT a safe Home marker: it
# false matches app.json's "name": "Atlitos" surfaced somewhere in the OS
# accessibility tree, so this assertion can report COMPLETED while the app
# sits on Register (proven via screenshot + screen-hierarchy JSON, see
# docs/qa/P5-IOS-FINDINGS.md F-4). The Home search bar placeholder is
# unique to Home (apps/mobile/src/components/ui/search-bar.tsx, only
# rendered by (tabs)/index.tsx, home/search.tsx and shop category screens,
# none of which are reachable from Login/Register), so it cannot false
# match auth screens.
- assertVisible: "What are you looking for..."

- openLink: "atlitos://login"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Log in"
- assertVisible: "Email or phone *"
- assertVisible: "Password *"
- assertVisible: "Continue as guest"
- repeat:
    times: 3
    while:
      notVisible: "Create your account"
    commands:
      - tapOn: "Create account"
      - waitForAnimationToEnd:
          timeout: 1500

# Register form fields, apps/mobile/src/app/(auth)/register.tsx. Date of
# birth was removed from signup and moved to the profile edit screen
# (commit 24bb65a: "move date of birth off signup into the profile", see
# apps/mobile/src/app/profile/edit.tsx line 317). Register now has five
# fields, not six; confirmed both in source (register.tsx has no dob Input)
# and in the installed build (main.jsbundle has zero "Date of birth *"
# strings originating from register.tsx).
- assertVisible: "Create your account"
- assertVisible: "Full name *"
- assertVisible: "Email *"
- assertVisible: "Phone *"
- assertVisible: "Password *"
- assertVisible: "Confirm password *"

# Back out without submitting or creating anything. Maestro's "back" command
# does not reliably pop this native stack on this build (no visible back
# control on auth screens per apps/mobile/src/app/(auth)/_layout.tsx's
# headerShown: false, and the edge-swipe "back" gesture command did not
# navigate in manual testing), so this uses Register's own working
# "Log in" link instead, a real UI affordance one tap away from the same
# destination.
- repeat:
    times: 3
    while:
      notVisible: "Email or phone *"
    commands:
      - tapOn: "Log in"
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible: "Email or phone *"
- repeat:
    times: 3
    while:
      visible: "Email or phone *"
    commands:
      - tapOn: "Continue as guest"
      - waitForAnimationToEnd:
          timeout: 1500
# This is the assertion F-4 identified as a false pass under the old
# "ATLITOS" text match (it can complete while still on Register, since
# "Atlitos" the OS app name is present somewhere off screen in the a11y
# tree). Use the Home search bar placeholder instead, which only renders
# on Home, and wait for it explicitly rather than a bare assertVisible so
# a real navigation delay is not mistaken for the same failure.
- extendedWaitUntil:
    visible: "What are you looking for..."
    timeout: 8000
- assertVisible: "What are you looking for..."
- assertVisible: "Badminton"
