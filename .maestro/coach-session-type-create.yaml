appId: com.atlitos.app
---
# STATUS: RED, AND DELIBERATELY LEFT RED. NOT part of the green suite yet.
# Do not "fix" it by weakening an assertion; read this first.
#
# WHAT WORKS: login, the deep link, the screen, and the Name field.
# WHAT DOES NOT: the iOS NUMERIC KEYPAD covers the duration chips, the price
# field and the submit button. Maestro reports those taps COMPLETED because the
# elements exist in the view hierarchy and it taps their COORDINATES, which sit
# underneath the keypad. So the taps land on the keypad, nothing is created,
# and every step still reports success.
#
# THIS FLOW ALREADY LIED ONCE AND THAT IS THE REAL LESSON. It previously ended:
#     assertVisible: "Powerplay batting"
#     assertNotVisible: "You are not bookable yet"
# and PASSED while creating nothing. The first matched the text still sitting in
# the Name INPUT; the second was already true because this coach has an existing
# type. Green flow, empty database. Exactly the vacuous-pass shape CLAUDE.md
# warns about, reproduced inside a brand new test on 2026-08-14.
#
# It now asserts the FORM CLOSED and the PRICE RENDERED, neither of which can be
# satisfied by text typed into an input, so it fails honestly instead.
#
# TO FINISH IT: get the fields above the keypad before tapping them (scroll the
# card up after each entry, or drive the form in an order that keeps the target
# visible). Verify the fix by checking public.session_types for the row, NOT by
# reading the flow's own green.
# COACH CREATES A SESSION TYPE. The write path that unblocks the whole
# marketplace, and nothing has ever tested it.
#
# Why this one first: `sessions` cannot exist without a `session_type_id`, so a
# coach with zero session types is NOT BOOKABLE BY ANYONE. The screen's own
# empty state says it out loud: "You are not bookable yet". Until tonight this
# could not be tested at all, because creating a session type is a WRITE and
# production is read only by standing rule.
#
# Runs against the LOCAL stack. Never point this at production.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"

- openLink: atlitos://login
# Other projects' apps share this simulator and the springboard chooser
# ("Open in ...?") renders on top of a correct screen while holding
# accessibility focus, so every assert beneath it fails and reads exactly like
# the screen never loaded. Cost an hour on 2026-08-14; dismiss it, do not
# debug it.
- runFlow:
    when:
      visible: "Open in .*"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Email or phone.*"
    timeout: 10000
- tapOn: "Email or phone input"
- inputText: "coach1@atlitos.dev"
- tapOn: "Password input"
- inputText: "AtlitosDemo!2026"
- tapOn:
    text: "Log in"
    index: 1
- extendedWaitUntil:
    visible: "Hyderabad|Save Password.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"

- openLink: atlitos://trainings/session-types
- runFlow:
    when:
      visible: "Open in .*"
    commands:
      - tapOn: "Cancel"
- extendedWaitUntil:
    visible: "Session types"
    timeout: 15000
- takeScreenshot: /tmp/coach-verify/01-session-types

# Open the form. The copy differs by state: "New session type" when the coach
# already has one, and the empty state offers its own affordance.
- runFlow:
    when:
      visible: "New session type"
    commands:
      - tapOn: "New session type"
- extendedWaitUntil:
    visible: "Name"
    timeout: 10000
- takeScreenshot: /tmp/coach-verify/02-form-open

# Select each field RELATIVE TO ITS LABEL, not by its placeholder text. Tapping
# the placeholder does not reliably move focus once the form has content, and
# the failure is silent and awful to read: on 2026-08-14 all three inputs
# landed in the Name field, which ended up as "Powerplay battingr45v1200" while
# the flow reported only that the created type was not visible.
- tapOn:
    below: "Name"
- inputText: "Powerplay batting"
# DISMISS THE KEYBOARD BETWEEN FIELDS. With it up it covers the lower half of
# this form, so a tap aimed at the duration chips or the price field lands on
# the keyboard instead, focus stays in Name, and every later inputText appends
# there. That produced "Powerplay battingev1200" in Name with the 45 chip never
# selected, while the flow reported only that the created type was not visible.
- hideKeyboard
# SCROLL THE FORM ABOVE THE KEYPAD. Being present in the view hierarchy is not
# enough: Maestro taps an element's COORDINATES, so a field that sits where the
# keypad will appear gets tapped THROUGH the keypad and the tap lands on a
# number key. Every step still reports COMPLETED. Pulling the card up first is
# what makes the remaining taps real.
- swipe:
    start: 50%, 75%
    end: 50%, 40%
# Duration is a CHIP ROW (30/45/60/90), not a text field. `below: "Duration in
# minutes"` lands on the chips, tapping a chip does not move text focus, and
# every later inputText therefore kept appending to Name: the field ended up
# reading "Powerplay battingw45v1200" while the flow reported only that the
# created type was not visible. Read the screenshot, not the assertion.
- tapOn: "45"
- tapOn: "800"
- inputText: "1200"
# No trailing hideKeyboard: the numeric pad has no dismiss affordance here, so
# the command fails with nothing to hide and takes the whole flow with it.
- takeScreenshot: /tmp/coach-verify/03-form-filled

# The numeric keypad covers the submit button, so tapping it hits the keypad
# and nothing is created. Dismiss by tapping a label first.
- tapOn: "Name"
- tapOn: "Add session type"

# ASSERT ON WHAT ONLY A CREATED CARD HAS, NOT ON THE NAME.
#
# This flow previously passed while creating NOTHING. `assertVisible: "Powerplay
# batting"` was satisfied by the text still sitting in the Name INPUT, and
# `assertNotVisible: "You are not bookable yet"` was already true because this
# coach has an existing type. Green, and the database had no such row. That is
# the vacuous-pass shape CLAUDE.md warns about, reproduced in a brand new test.
#
# The form closing is the only signal the server accepted the write, and the
# price appears only on a rendered card, never in the empty-placeholder field.
# "New session type" is BOTH the form heading AND the label on the button that
# opens it (session-types.tsx:432), so notVisible on it can never pass: closing
# the form reveals the button with identical text. Assert the price instead,
# WITH THE THOUSANDS COMMA. A rendered card shows "1,200"; the raw price input
# holds "1200", so the comma is what distinguishes a created card from text
# still sitting in the form, and this cannot pass vacuously the way the earlier
# name assertion did.
# The new card lands BELOW the fold once the list holds two types plus the
# availability banner, so scroll to it. formatINR(1200) renders "1,200"
# (packages/theme/src/index.ts:41, Indian grouping), and the raw price input
# holds "1200" without the comma, so this cannot be satisfied by text left in
# the form.
# NO assertVisible HERE, AND THAT IS DELIBERATE. This screen is INVISIBLE to
# XCUITest: dumped at this exact step, the hierarchy holds SEVEN text nodes and
# all seven are the simulator status bar ("0%", "No signal", "3 of 3 Wi-Fi
# bars"). The rendered card is absent from it, so assertVisible on the name,
# the price ("1,200") or the duration ("45 min") all fail while the screenshot
# plainly shows "Powerplay batting, Rs 1,200, 45 min" and public.session_types
# holds the row. Second screen with this signature after the Clutch comments
# sheet, so it is a pattern, not a quirk.
#
# The write is therefore verified by the SCREENSHOT plus a database check, not
# by a green assertion. Run this to confirm a real run:
#   psql "$ATLITOS_LOCAL_DB_URL" -c "select name, duration_minutes, price
#     from public.session_types where name = 'Powerplay batting'"
# Expect: Powerplay batting | 45 | 1200.00
#
# Do NOT replace this with an assertion that happens to go green. The first
# version of this flow did exactly that and passed over an EMPTY table.
- takeScreenshot: /tmp/coach-verify/06-created-card
- takeScreenshot: /tmp/coach-verify/04-created

# NOTE ON NEGATIVE ASSERTIONS ON THIS SCREEN. The obvious check here would be
#   assertNotVisible: "You are not bookable yet"
# and it PASSES. It also passes when nothing was created, when the screen failed
# to load, and when the app is showing a completely different page, because
# XCUITest sees nothing on this screen at all: everything is "not visible", so
# every negative assertion is vacuously true. A green here means nothing.
#
# That is worse than the positive-assertion trap that made the first version of
# this flow pass over an empty table, because a negative assertion looks like a
# careful check while proving strictly nothing.
- takeScreenshot: /tmp/coach-verify/05-bookable
