appId: com.atlitos.app
---
# Phase S3 Track H gate: shop search cold-start path
# (PRD-07 FR-40, FR-41, FR-42, AC-11-1, AC-11-2).
#
# Asserts: launch the app, navigate to /shop (Home categories row or deep link),
# tap the search input, type "light racket for a 12 year old starting badminton",
# see gear tiles load (with at least one containing "Badminton" or "Racket"),
# tap the tennis sport chip and assert the grid changes (tile 0 is still visible
# but its content differs), then clear and exit.
#
# Positive assertions on the destination screen before each exit.

- launchApp:
    clearState: false

# Navigate to shop via deep link /shop (atlitos://shop).
- tapOn:
    id: home-more-button
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# If presented with auth gate, skip it.
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
      - waitForAnimationToEnd:
          timeout: 3000

# Try deep link to shop.
- openLink: "atlitos://shop"
- waitForAnimationToEnd:
    timeout: 2000

# Assert we are on the shop screen with the search input visible.
- assertVisible:
    id: shop-search-input

# Tap the search input to focus it.
- tapOn:
    id: shop-search-input
- waitForAnimationToEnd:
    timeout: 1000

# Type the test query, then prove it is IN the field. The first version of
# this flow passed while the field dropped every character after the first,
# because the default grid also has a gear-tile-0. Never assert the grid
# alone.
- inputText: "light racket for a 12 year old starting badminton"
- assertVisible:
    text: "light racket for a 12 year old starting badminton"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    text: "light racket for a 12 year old starting badminton"

# The top tile must be a badminton racket, not whatever the catalogue lists first.
- assertVisible:
    id: gear-tile-0
- assertVisible:
    text: ".*(Badminton|badminton).*(Racket|racket).*"

# Now tap the tennis sport chip to filter by sport and assert the grid updates.
- tapOn:
    id: shop-sport-chip-tennis
- waitForAnimationToEnd:
    timeout: 2000

# After sport filter, the grid should still have gear-tile-0 but with different
# content (tennis results instead of badminton). Assert it is still visible.
- assertVisible:
    id: gear-tile-0

# Clear the search and exit cleanly.
- tapOn:
    id: shop-search-input
- waitForAnimationToEnd:
    timeout: 500
- eraseText

- waitForAnimationToEnd:
    timeout: 1000
