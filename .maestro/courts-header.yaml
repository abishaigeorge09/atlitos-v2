appId: com.atlitos.app
---
# Courts tab (apps/mobile/src/app/(tabs)/courts/index.tsx). Asserts the
# "Courts" title and one seeded, currently verified court name ("Turf B",
# a court row on the Gachibowli Box Cricket Turf venue, confirmed live via
# read only SQL against the syzzfgaudpifwvbpycyi project on 2026-08-13,
# court id b0000000-0000-0000-0000-000000000002) so the header-overlap area
# has a real reference point in the screenshot. Not a stale fixture: this
# court still exists, it just was not always on screen without scrolling
# (the list's order shifts depending on how far location resolution has
# gotten when the screen renders), so this now scrolls for it instead of
# assuming it is above the fold.
#
# BUG-039 (distance readout) reverified fixed on 2026-08-13: the header no
# longer shows an impossible "13,486.1 km" distance for a guest with no
# resolved location; it now reads "Showing all verified courts" with no
# distance claim. See docs/qa/P5-IOS-FINDINGS.md classification section for
# the before/after screenshots.
#
# APP BUG (recorded in the suite report): tapping the "Courts" bottom tab
# from Home intermittently does nothing (confirmed by repeated manual runs;
# same symptom independently found on CategoriesRow's per-sport icons, see
# shop-back.yaml). The retry loop below is a test-harness workaround for
# that flakiness, not a fix.
- launchApp
- runFlow:
    when:
      visible: "Continue as guest"
    commands:
      - tapOn: "Continue as guest"
- scrollUntilVisible:
    element:
      text: "Log out"
    direction: DOWN
    timeout: 25000
    speed: 60
    optional: true
- runFlow:
    when:
      visible: "Log out"
    commands:
      - tapOn: "Log out"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      text: "What are you looking for..."
    direction: UP
    timeout: 10000
    optional: true
- assertVisible: "ATLITOS"
- repeat:
    times: 4
    while:
      notVisible: "My bookings"
    commands:
      - tapOn: "Courts"
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible: "Courts"
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      text: "Turf B"
    direction: DOWN
    timeout: 15000
- assertVisible: "Turf B"
- takeScreenshot: /tmp/maestro-suite/courts-header
